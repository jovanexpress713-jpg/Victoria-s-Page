services:
  - type: web
    name: victoria-line-soft-preview
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: VLS_SESSION_SECRET
        generateValue: true
      - key: VLS_SECURE_COOKIES
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
