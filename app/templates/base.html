<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a12"><meta name="description" content="Victoria Line Soft — حلول رقمية وذكاء اصطناعي لنمو الأعمال"><title>{% block title %}Victoria Line Soft — Digital Growth{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/static/site.css"></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><header><a class="brand" href="/"><span class="brand-mark">V</span><span>VICTORIA <small>LINE SOFT</small></span></a><nav><a href="/">الرئيسية</a><a href="/products">الحلول</a><a href="/insights">الرؤى والمقالات</a><a href="/contact">ابدأ مشروعك</a></nav><a class="nav-cta" href="/contact">تحدث مع AI</a></header><main>{% block content %}{% endblock %}</main><a class="wa-float" href="/whatsapp" aria-label="تواصل معنا عبر واتساب">WhatsApp <span>↗</span></a><footer><strong>Victoria Line Soft</strong><span>نبني منتجات رقمية تساعد الشركات على النمو.</span><span>© 2026</span></footer><div class="reading-progress" aria-hidden="true"></div><script>
(function(){
 const progress=document.querySelector('.reading-progress');
 function updateProgress(){if(!progress)return;const doc=document.documentElement;const max=doc.scrollHeight-doc.clientHeight;progress.style.width=(max>0?(doc.scrollTop/max)*100:0)+'%'}
 window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
 const cards=document.querySelectorAll('.reveal');
 if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}}),{threshold:.08});cards.forEach(card=>observer.observe(card))}
 else cards.forEach(card=>card.classList.add('is-visible'));
})();
</script></body></html>
