<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Victoria Line Soft — حلول رقمية وتصميم وذكاء اصطناعي لنمو الأعمال">
  <title>{% block title %}Victoria Line Soft — حلول رقمية للأعمال{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body class="{% if request.url.path == '/' %}home-layout{% endif %}">
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Victoria Line Soft — الرئيسية">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span>VICTORIA <small>LINE SOFT</small></span>
    </a>
    <button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">القائمة <span aria-hidden="true">☰</span></button>
    <nav id="site-navigation" aria-label="التنقل الرئيسي">
      <a href="/">الرئيسية</a><a href="/products">الحلول والخدمات</a><a href="/lab">المختبر الحي</a><a href="/ai/sales">مساعد ذكي</a><a href="/insights">المعرفة</a><a href="/contact">ابدأ مشروعك</a>
    </nav>
    <a class="nav-cta" href="/contact">ناقش مشروعك <span aria-hidden="true">↗</span></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <a class="wa-float" href="/whatsapp" aria-label="تواصل معنا عبر واتساب">تواصل عبر واتساب <span aria-hidden="true">↗</span></a>
  <footer class="site-footer">
    <a class="footer-brand" href="/"><span class="brand-mark" aria-hidden="true">V</span><strong>Victoria Line Soft</strong></a>
    <span>حلول رقمية وتصميم وتجارب ذكية للأعمال.</span>
    <div><a href="/products">الخدمات</a><a href="/lab">المختبر الحي</a><a href="/ai/sales">مساعد المبيعات</a><a href="/insights">مركز المعرفة</a><a href="/contact">تواصل معنا</a></div>
    <small>© 2026 Victoria Line Soft</small>
  </footer>
  <div class="reading-progress" aria-hidden="true"></div>
  <script>
  (function(){
    const progress=document.querySelector('.reading-progress');
    function updateProgress(){if(!progress)return;const doc=document.documentElement;const max=doc.scrollHeight-doc.clientHeight;progress.style.width=(max>0?doc.scrollTop/max*100:0)+'%'}
    window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
    const toggle=document.querySelector('.mobile-nav-toggle'),nav=document.querySelector('#site-navigation');
    if(toggle&&nav){toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));nav.classList.toggle('is-open',!open)});nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{toggle.setAttribute('aria-expanded','false');nav.classList.remove('is-open')}))}
    const cards=document.querySelectorAll('.reveal, .service-card, .service-catalog-card, .insight-card, .work-card, .quote-form-card, .ai-assistant-card, .stat-card, .admin-card, .process-list article');
    cards.forEach((card,index)=>{card.classList.add('reveal');card.style.transitionDelay=(Math.min(index%6,5)*65)+'ms'});
    if('IntersectionObserver' in window && !(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}}),{threshold:.08});cards.forEach(card=>observer.observe(card))}
    else cards.forEach(card=>card.classList.add('is-visible'));
  })();
  </script>
</body>
</html>
